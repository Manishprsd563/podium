<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podium</title>
<!-- Every browser dependency is pinned to an exact version: a floating range
     would let a bad upstream release run in the page that holds the LiveKit
     token and the microphone stream. -->
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "gsap":"https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js",
  "lenis":"https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.mjs",
  "livekit-client":"https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.esm.mjs"
}}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div id="stage" data-layout="center">

  <div id="hero">
    <div id="orb-wrap"><canvas id="orb"></canvas></div>
    <div id="caption-col">
      <p id="caption" aria-live="polite"></p>
      <p id="user-line" class="hidden" aria-live="polite"></p>
    </div>
  </div>
  <p id="wake" class="hidden">Tap anywhere to wake Podium</p>

  <div id="slot">

    <section id="view-setup" class="view view-hidden">
      <form id="setup-form" novalidate>
        <label class="visually-hidden" for="setup-topic">What are you presenting?</label>
        <input id="setup-topic" type="text" placeholder="What are you presenting?" required autocomplete="off">
        <div class="setup-row">
          <label>level
            <select id="setup-level">
              <option value="beginner">beginner</option>
              <option value="intermediate" selected>intermediate</option>
              <option value="advanced">advanced</option>
            </select>
          </label>
          <label>length
            <select id="setup-length">
              <option value="60" selected>60s</option>
              <option value="90">90s</option>
              <option value="120">120s</option>
            </select>
          </label>
          <button id="setup-upload-btn" type="button">Upload PDF</button>
          <input id="setup-upload-input" class="visually-hidden" type="file" accept="application/pdf">
        </div>
        <p id="setup-status" class="hint"></p>
        <button id="setup-submit" type="submit" class="visually-hidden">Start</button>
      </form>
      <p id="setup-hint" class="hint"></p>
    </section>

    <section id="view-prep" class="view view-hidden">
      <p id="prep-number">&mdash;</p>
      <p id="prep-hint">say &ldquo;ready&rdquo; or press Enter</p>
    </section>

    <section id="view-countdown" class="view view-hidden">
      <div id="countdown-ring" class="hidden" aria-hidden="true"></div>
      <p id="countdown-number" class="hidden"></p>
      <p id="countdown-status"></p>
      <div id="countdown-error" class="hidden">
        <p id="countdown-error-message"></p>
        <button id="countdown-retry" type="button">Try again</button>
      </div>
    </section>

    <section id="view-present" class="view view-hidden">
      <div id="present-clock">&mdash;</div>
      <h1 id="present-title">&mdash;</h1>
      <ul id="present-bullets"></ul>
      <div id="present-counter"></div>
      <div id="present-nav">
        <button id="present-prev" class="present-step" type="button" aria-label="Previous slide">&larr;</button>
        <button id="present-next" class="present-step" type="button" aria-label="Next slide">&rarr;</button>
      </div>
      <p id="present-hint" class="hint">&larr; &rarr; move between slides &middot; Enter when you&rsquo;re done</p>
      <button id="present-done" type="button">I&rsquo;m done</button>
    </section>

    <section id="view-dashboard" class="view view-hidden"></section>

  </div>

  <div id="choices" class="hidden"></div>

</div>

<button id="unmute" class="hidden" type="button">Tap to unmute Podium</button>
<div id="toast" class="hidden" role="alert"></div>

<div id="statusbar">
  <span id="sb-conn">connecting</span>
  <span id="sb-agent">agent absent</span>
  <span id="sb-provider"></span>
  <span id="sb-attention">listening</span>
  <span id="sb-phase">setup</span>
  <span id="sb-stage"></span>
  <span id="sb-mic">mic off</span>
  <span id="sb-room"></span>
  <span id="sb-level"><i id="sb-level-fill"></i></span>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
