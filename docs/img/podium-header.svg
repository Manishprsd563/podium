<svg width="1600" height="460" viewBox="0 0 1600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="podium-title podium-desc">
  <title id="podium-title">podium — voice-native presentation coach</title>
  <desc id="podium-desc">A dark, ricing-inspired banner for the podium project: a centered lowercase geometric wordmark "podium" framed above and below by tapering audio-waveform bar marks in lavender, mint, and coral, with faint stage-corner crop marks, a corner workspace-grid motif, and a small four-swatch color palette strip, all set on a deep blue-black background.</desc>
  <defs>
    <linearGradient id="bg-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12192c"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <radialGradient id="glow-lavender" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3c0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7dd3c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-coral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a997" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5a997" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- contained background: renders identically on GitHub light/dark themes -->
  <rect x="0" y="0" width="1600" height="460" fill="url(#bg-depth)"/>

  <!-- ambient ricing glow, blurred and low-opacity, fully contained -->
